<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Thakur Bites - Digital College Canteen App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="thakur_bites">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Identity Platform / Firebase Web Auth Configuration -->
  <meta name="google-signin-client_id" content="391012293021-web.apps.googleusercontent.com">

  <title>Thakur Bites</title>
  <link rel="manifest" href="manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var r of registrations) {
          r.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function (keys) {
        for (var k of keys) {
          caches.delete(k);
        }
      });
    }

    // 1. Anti-Clickjacking Framebusting Guard (RFC 7034 / OWASP A05)
    try {
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    } catch (_) {}

    // 2. High-Visibility Console Security Warning
    try {
      console.log('%c[STOP] THAKUR BITES STUDENT APP PERIMETER', 'color: #DC2626; font-size: 28px; font-weight: 900;');
      console.log(
        '%cThis browser console is intended for developers. Any attempt to tamper with prices, token states, or transaction data is recorded and reported under college disciplinary regulations.\nAll checkout pricing and order state transitions are strictly server-authoritative.',
        'color: #1F2937; font-size: 14px; font-weight: 600;'
      );
    } catch (_) {}

    // 3. Client Canary Honeypot Traps
    ['debugMode', 'bypassAuth', 'bypassPayment', 'overridePrice', 'forceRole', 'adminKey', '__DEBUG__'].forEach(function(key) {
      try {
        Object.defineProperty(window, key, {
          configurable: true,
          get: function() { console.warn('[CANARY_TRAP] Unauthorized property read probe on window.' + key); return undefined; },
          set: function(val) { console.warn('[CANARY_TRAP] Unauthorized property write attack on window.' + key); }
        });
      } catch (_) {}
    });
  </script>

  <!-- Razorpay Official Checkout SDK & Web Bridge -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpayCheckout = function(options, successCallback, failureCallback) {
      try {
        if (typeof Razorpay === 'undefined') {
          if (failureCallback) failureCallback('Razorpay SDK failed to load. Please check your internet connection or ad-blocker.');
          return;
        }
        var opts = Object.assign({}, options);
        opts.handler = function(response) {
          if (successCallback) {
            successCallback(
              response.razorpay_payment_id || '',
              response.razorpay_order_id || '',
              response.razorpay_signature || ''
            );
          }
        };
        opts.modal = {
          ondismiss: function() {
            if (failureCallback) failureCallback('Payment was cancelled.');
          }
        };
        var rzp = new Razorpay(opts);
        rzp.on('payment.failed', function(response) {
          var desc = (response && response.error && response.error.description)
            ? response.error.description
            : 'Payment failed or was declined.';
          if (failureCallback) failureCallback(desc);
        });
        rzp.open();
      } catch (err) {
        if (failureCallback) failureCallback(err.toString());
      }
    };
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8F9FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
      pointer-events: none;
      animation: autoDismissSplash 0.5s ease 4s forwards;
    }
    @keyframes autoDismissSplash {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }
    .splash-logo {
      font-size: 28px;
      font-weight: 800;
      color: #D32F2F;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .splash-tagline {
      font-size: 13px;
      color: #6C757D;
      margin-bottom: 28px;
      font-weight: 500;
    }
    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E9ECEF;
      border-top: 3px solid #D32F2F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="splash-logo">🍛 THAKUR BITES</div>
    <div class="splash-tagline">TCET Digital College Canteen</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    function hideLoadingSplash() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoadingSplash);
    // Safety fallback: fade out splash after 3.5s so UI is never permanently blocked
    setTimeout(hideLoadingSplash, 3500);
  </script>
  <script src="flutter_bootstrap.js?v=20260914_0820" async></script>
</body>
</html>
