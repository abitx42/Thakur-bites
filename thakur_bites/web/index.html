  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var r of registrations) {
          r.unregister();
        }
      });
      navigator.serviceWorker.register = function () {
        return Promise.reject(new Error('ServiceWorker registration disabled by security policy.'));
      };
    }
    if ('caches' in window) {
      caches.keys().then(function (keys) {
        for (var k of keys) {
          caches.delete(k);
        }
      });
    }

    // 1. Anti-Clickjacking Framebusting Guard (RFC 7034 / OWASP A05)
    try {
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    } catch (_) {}

    // 2. High-Visibility Console Security Warning
    try {
      console.log('%c[STOP] THAKUR BITES STUDENT APP PERIMETER', 'color: #DC2626; font-size: 28px; font-weight: 900;');
      console.log(
        '%cThis browser console is intended for developers. Any attempt to tamper with prices, token states, or transaction data is recorded and reported under college disciplinary regulations.\nAll checkout pricing and order state transitions are strictly server-authoritative.',
        'color: #1F2937; font-size: 14px; font-weight: 600;'
      );
    } catch (_) {}

    // 3. Universal Web Anti-Tamper & Mod-Lockdown Guard (Testing Hardened)
    try {
      sessionStorage.removeItem('tb_web_lockdown_active');
      sessionStorage.removeItem('tb_tamper_lockdown_active');
      localStorage.removeItem('tb_web_lockdown_active');
      localStorage.removeItem('tb_tamper_lockdown_active');
    } catch (_) {}

    var isWebLockdownActive = false;
    function triggerWebTamperLockdown(reason, details) {
      if (isWebLockdownActive) return;
      isWebLockdownActive = true;
      details = details || {};

      console.error('[SECURITY TAMPER WARNING] Violation: ' + reason, details);

      // Render Full-Screen Notification Overlay with Dismiss Option for Testing
      var overlay = document.getElementById('tb-web-lockdown-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'tb-web-lockdown-overlay';
        overlay.setAttribute('style',
          'position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;' +
          'background:#0A0D14!important;color:#F3F4F6!important;z-index:2147483647!important;' +
          'display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;' +
          'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif!important;padding:24px!important;box-sizing:border-box!important;text-align:center!important;'
        );
        overlay.innerHTML =
          '<div style="max-width:480px;width:100%;background:#111827;border:1px solid #DC2626;border-radius:16px;padding:32px 24px;box-shadow:0 25px 50px -12px rgba(220,38,38,0.3);text-align:center;">' +
            '<div style="width:64px;height:64px;background:rgba(220,38,38,0.15);border:2px solid #EF4444;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">' +
              '<span style="font-size:32px;">🛡️</span>' +
            '</div>' +
            '<div style="font-size:11px;font-weight:800;letter-spacing:1.5px;color:#EF4444;text-transform:uppercase;margin-bottom:6px;">SECURITY INTEGRITY CHECK</div>' +
            '<h1 style="font-size:20px;font-weight:800;color:#FFF;margin:0 0 10px 0;">Client Environment Notice</h1>' +
            '<p style="font-size:13px;line-height:1.6;color:#9CA3AF;margin:0 0 20px 0;">An unexpected client modification or browser extension script was observed.</p>' +
            '<div style="background:#1F2937;border-radius:8px;padding:12px 14px;text-align:left;font-family:monospace;font-size:12px;margin-bottom:20px;border:1px solid #374151;">' +
              '<div style="color:#9CA3AF;margin-bottom:4px;">EVENT: <span style="color:#F87171;font-weight:bold;">' + reason + '</span></div>' +
              '<div style="color:#9CA3AF;">STATUS: <span style="color:#34D399;font-weight:bold;">SESSION SAFE</span></div>' +
            '</div>' +
            '<button id="tb-dismiss-lockdown-btn" style="background:#DC2626;color:#FFF;border:none;padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;">Dismiss & Continue Testing</button>' +
          '</div>';
        document.body.appendChild(overlay);
        document.getElementById('tb-dismiss-lockdown-btn').addEventListener('click', function() {
          isWebLockdownActive = false;
          try {
            sessionStorage.removeItem('tb_web_lockdown_active');
            sessionStorage.removeItem('tb_tamper_lockdown_active');
          } catch (_) {}
          overlay.remove();
        });
      }
    }

    // 4. Client Canary Honeypot Traps (Only monitor synthetic canary keys)
    ['__tb_canary_overridePrice__', '__tb_canary_bypassPayment__'].forEach(function(key) {
      try {
        Object.defineProperty(window, key, {
          configurable: true,
          get: function() { return undefined; },
          set: function(val) {
            console.warn('[CANARY_TRAP] Tamper write on window.' + key + ' =', val);
          }
        });
      } catch (_) {}
    });

    // 5. Native Function Hook Detection (Warning only — never locks out browser extensions)
    setInterval(function() {
      try {
        var toStr = Function.prototype.toString;
        if (window.fetch && !toStr.call(window.fetch).includes('[native code]')) {
          console.warn('[Sentinel] Extension wrapped fetch detected.');
        }
        if (window.XMLHttpRequest && !toStr.call(XMLHttpRequest.prototype.open).includes('[native code]')) {
          console.warn('[Sentinel] Extension wrapped XMLHttpRequest detected.');
        }
      } catch (_) {}
    }, 5000);

    // 6. DOM Mutation Observer (Warning only for dynamic extension elements)
    try {
      var isTrusted = function(src) {
        if (!src) return false;
        try {
          var u = new URL(src, window.location.href);
          if (u.origin === window.location.origin) return true;
          var h = u.hostname.toLowerCase();
          return h.endsWith('.gstatic.com') || h.endsWith('.googleapis.com') || h.endsWith('.google.com') ||
                 h.endsWith('.razorpay.com') || h.endsWith('.jsdelivr.net') || u.protocol === 'blob:';
        } catch (_) { return false; }
      };

      var domObs = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var added = mutations[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            var n = added[j];
            if (n.nodeType !== 1) continue;
            var t = (n.tagName || '').toUpperCase();
            if (t === 'BASE' || t === 'OBJECT' || t === 'EMBED' || t === 'APPLET') {
              console.warn('[Sentinel] Disallowed DOM tag:', t);
            }
          }
        }
      });
      domObs.observe(document.documentElement, { childList: true, subtree: true });
    } catch (_) {}
  </script>

  <!-- Razorpay Official Checkout SDK & Web Bridge -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpayCheckout = function(options, successCallback, failureCallback) {
      try {
        if (typeof Razorpay === 'undefined') {
          if (failureCallback) failureCallback('Razorpay SDK failed to load. Please check your internet connection or ad-blocker.');
          return;
        }
        var opts = Object.assign({}, options);
        opts.handler = function(response) {
          if (successCallback) {
            successCallback(
              response.razorpay_payment_id || '',
              response.razorpay_order_id || '',
              response.razorpay_signature || ''
            );
          }
        };
        opts.modal = {
          ondismiss: function() {
            if (failureCallback) failureCallback('Payment was cancelled.');
          }
        };
        var rzp = new Razorpay(opts);
        rzp.on('payment.failed', function(response) {
          var desc = (response && response.error && response.error.description)
            ? response.error.description
            : 'Payment failed or was declined.';
          if (failureCallback) failureCallback(desc);
        });
        rzp.open();
      } catch (err) {
        if (failureCallback) failureCallback(err.toString());
      }
    };
  </script>

  <script>
    function hideLoadingSplash() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoadingSplash);
    // Safety fallback: fade out splash after 3.5s so UI is never permanently blocked
    setTimeout(hideLoadingSplash, 3500);

    // ═══════════════════════════════════════════════════════════════
    // STUDENT LOCKSCREEN WEB PUSH & SYSTEM NOTIFICATIONS ENGINE
    // ═══════════════════════════════════════════════════════════════
    window.requestStudentPushPermission = function () {
      if (!('Notification' in window)) return Promise.resolve('unsupported');
      if (Notification.permission === 'granted') return Promise.resolve('granted');
      if (Notification.permission === 'denied') return Promise.resolve('denied');
      return Notification.requestPermission().catch(function () { return 'denied'; });
    };

    window.sendStudentSystemNotification = function (title, body, tag) {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        return false;
      }
      try {
        var options = {
          body: body || '',
          icon: 'icons/Icon-192.png',
          badge: 'icons/Icon-192.png',
          tag: tag || 'tb-order-status',
          renotify: true,
          vibrate: [200, 100, 200],
          requireInteraction: tag === 'tb-order-ready',
          data: { url: window.location.origin }
        };
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(function (reg) {
            reg.showNotification(title, options);
          }).catch(function () {
            new Notification(title, options);
          });
        } else {
          new Notification(title, options);
        }
        return true;
      } catch (e) {
        return false;
      }
    };
  </script>
