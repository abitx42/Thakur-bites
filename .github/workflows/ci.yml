name: Thakur Bites CI/CD & Security Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-checks:
    name: Flutter Analyzer & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: thakur_bites
        run: flutter pub get

      - name: Flutter Format Check
        working-directory: thakur_bites
        run: dart format --output=none --set-exit-if-changed .

      - name: Flutter Strict Analyzer (Fatal Infos)
        working-directory: thakur_bites
        run: dart analyze --fatal-infos

      - name: Run Flutter Tests
        working-directory: thakur_bites
        run: flutter test --coverage

  functions-and-security-checks:
    name: Cloud Functions & Security Abuse Test Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci || npm install

      - name: Run TypeScript Compiler Build / Typecheck
        working-directory: functions
        run: npm run build

      - name: Run Invariants & Unit Tests
        working-directory: functions
        run: node --test test/checkout.test.js test/payments.test.js test/rate_limiter.test.js

      - name: Run Security Abuse Attack Vectors (IDOR, Replay, Race Conditions, Price Tampering)
        working-directory: functions
        run: node --test test/security_abuse.test.js

      - name: Secret Scanning Audit
        run: |
          echo "Verifying zero hardcoded production secrets..."
          ! grep -rn "process.env.PAYMENT_GATEWAY_SECRET || 'tcet_thakur_bites_secret_key_2026'" functions/src/
