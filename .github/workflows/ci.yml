name: Thakur Bites CI and Security Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-invariant-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      PUB_CACHE: ${{ github.workspace }}/.cache/pub
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
      FIREBASE_EMULATORS_PATH: ${{ github.workspace }}/.cache/firebase/emulators

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Read Flutter pin and verify npm pin
        id: pins
        run: |
          set -euo pipefail
          test "$(npm --version)" = '10.9.9'
          FLUTTER_VERSION="$(< .flutter-version)"
          [[ "$FLUTTER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pins.outputs.flutter }}
          channel: stable
          cache: true

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked Node dependencies in both trees
        run: |
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund

      - name: Install locked Flutter dependencies
        working-directory: thakur_bites
        run: flutter pub get --enforce-lockfile

      - name: Run security, offline regression, Flutter and real emulator gates
        run: bash scripts/run_all_security_checks.sh

      - name: Build staged web bundle for inspection
        env:
          FIREBASE_APP_CHECK_WEB_KEY: ${{ vars.FIREBASE_APP_CHECK_WEB_KEY }}
        run: npm run build:web

      - name: Package public runtime without credentials or deployment
        run: bash scripts/deploy_antideploy.sh --package-only "$RUNNER_TEMP/thakur-bites-runtime.tar.gz"

      - name: Upload public runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: thakur-bites-public-runtime
          path: ${{ runner.temp }}/thakur-bites-runtime.tar.gz
          retention-days: 7
          if-no-files-found: error
