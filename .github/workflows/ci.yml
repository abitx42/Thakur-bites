name: Thakur Bites Platform 2.0 CI & Security Invariant Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-invariant-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Setup Flutter (v3.29.x)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Cloud Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Dependency Vulnerability Security Audit
        working-directory: functions
        run: npm audit --audit-level=high

      - name: Scan Codebase for Leaked Secrets & Credentials
        run: node scripts/scan_secrets.js

      - name: Run SAST Static Application Security Testing
        run: node scripts/sast_analyzer.js

      - name: Compile Backend TypeScript
        working-directory: functions
        run: npm run build

      - name: Run Backend Invariant Security Abuse Suite (172 Tests)
        working-directory: functions
        run: npm test

      - name: Install Flutter Client Dependencies
        working-directory: thakur_bites
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: thakur_bites
        run: dart analyze --fatal-infos

      - name: Run Flutter Client Test Suite (31 Tests)
        working-directory: thakur_bites
        run: flutter test

      - name: Run Master CI Security Verification Script
        run: bash scripts/run_all_security_checks.sh

      - name: Build Flutter Web Production Bundle
        working-directory: thakur_bites
        run: flutter build web --release
