name: Build Android Pilot APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

jobs:
  build-android-apk:
    name: Build Android APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter (v3.29.x)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Client Dependencies
        working-directory: thakur_bites
        run: flutter pub get

      - name: Build Android APK
        working-directory: thakur_bites
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "Building Debug APK..."
            flutter build apk --debug
          else
            echo "Building Release APK..."
            flutter build apk --release
          fi

      - name: Locate Generated APK
        working-directory: thakur_bites
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thakur-bites-${{ github.event.inputs.build_type || 'release' }}-apk
          path: thakur_bites/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
