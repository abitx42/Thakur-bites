name: Build Android Pilot APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PUB_CACHE: ${{ github.workspace }}/.cache/pub
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Read Flutter pin and verify npm pin
        id: pins
        run: |
          set -euo pipefail
          test "$(npm --version)" = '10.9.9'
          FLUTTER_VERSION="$(< .flutter-version)"
          [[ "$FLUTTER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pins.outputs.flutter }}
          channel: stable
          cache: true

      - name: Install locked Node dependencies in both trees
        run: |
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund

      - name: Install Client Dependencies
        working-directory: thakur_bites
        run: flutter pub get --enforce-lockfile

      - name: Run offline regression suite
        run: make test

      - name: Build Android APK
        working-directory: thakur_bites
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          case "$BUILD_TYPE" in
            debug) flutter build apk --debug --no-pub ;;
            release) flutter build apk --release --no-pub ;;
            *) printf '%s\n' 'Unsupported APK build type.' >&2; exit 1 ;;
          esac

      - name: Locate Generated APK
        working-directory: thakur_bites
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thakur-bites-${{ github.event.inputs.build_type || 'release' }}-apk
          path: thakur_bites/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
