<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://*.firebaseapp.com; img-src 'self' data: https:;">
  <title>Thakur Bites — Business Administration Portal (Menu, Stock & Analytics)</title>
  
  <!-- Design System Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css?v=4">

  <!-- Pre-Bootstrap Anti-Tamper & Integrity Seal -->
  <script>
    (function() {
      try {
        if (window.top !== window.self) {
          window.top.location = window.self.location;
        }
      } catch (_) {
        document.documentElement.innerHTML = '';
      }
      try {
        var breach = sessionStorage.getItem('tb_tamper_lockdown_active') || sessionStorage.getItem('tb_web_lockdown_active');
        if (breach) {
          window.stop && window.stop();
          document.addEventListener('DOMContentLoaded', function() {
            document.body.innerHTML = '<div style="position:fixed;inset:0;background:#0A0D14;color:#F87171;display:flex;align-items:center;justify-content:center;font-family:sans-serif;flex-direction:column;z-index:9999999;padding:24px;text-align:center;"><h2>[SECURITY LOCKDOWN] Session Quarantined</h2><p style="color:#9CA3AF;">Violation: ' + breach + '</p></div>';
          });
        }
      } catch (_) {}
      try {
        ['isAdmin', 'role', 'isSuperUser', 'isDeveloper', 'debugMode', 'bypassAuth'].forEach(function(prop) {
          var _v = undefined;
          Object.defineProperty(Object.prototype, prop, {
            configurable: false,
            get: function() { return _v; },
            set: function(v) {
              try { sessionStorage.setItem('tb_tamper_lockdown_active', 'PROTOTYPE_POLLUTION_ATTACK'); } catch(_) {}
              window.location.reload();
            }
          });
        });
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="app-root"></div>

  <!-- Business Administration Script -->
  <script type="module" src="js/adminApp.js?v=6"></script>
</body>
</html>
