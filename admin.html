<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://*.firebaseapp.com https://cloudflareinsights.com https://*.cloudflareinsights.com wss://*.firebaseio.com wss://*.googleapis.com; img-src 'self' data: https:;">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>Thakur Bites — Business Administration Portal (Menu, Stock & Analytics)</title>
  
  <!-- Design System Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css?v=5">

  <!-- Pre-Bootstrap Anti-Tamper & Integrity Seal -->
  <script>
    (function() {
      try {
        if (window.top !== window.self) {
          window.top.location = window.self.location;
        }
      } catch (_) {
        document.documentElement.innerHTML = '';
      }
      try {
        sessionStorage.removeItem('tb_tamper_lockdown_active');
        localStorage.removeItem('tb_tamper_lockdown_active');
        sessionStorage.removeItem('tb_web_lockdown_active');
        localStorage.removeItem('tb_web_lockdown_active');
      } catch (_) {}
      try {
        ['isAdminCanary', 'isSuperUserCanary', 'bypassAuthCanary'].forEach(function(prop) {
          var _v = undefined;
          Object.defineProperty(Object.prototype, prop, {
            configurable: true,
            get: function() { return _v; },
            set: function(v) {
              try { sessionStorage.setItem('tb_tamper_lockdown_active', 'PROTOTYPE_POLLUTION_ATTACK'); } catch(_) {}
              window.location.reload();
            }
          });
        });
      } catch (_) {}
      try {
        if ('serviceWorker' in navigator && navigator.serviceWorker) {
          navigator.serviceWorker.register = function() {
            return Promise.reject(new Error('ServiceWorker disabled by security policy'));
          };
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="app-root"></div>

  <!-- Business Administration Script -->
  <script type="module" src="js/adminApp.js?v=9"></script>
</body>
</html>
